[project]
name = "cluxmate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "jinja2>=3.0",
    "httpx>=0.27.0",
]

[project.scripts]
cluxmate = "cluxmate.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {include = ["cluxmate*"]}}
