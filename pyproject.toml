[project]
name = "cluxmate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "jinja2>=3.0",
    "httpx>=0.27.0",
]

[project.scripts]
cluxmate = "cluxmate.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {include = ["cluxmate*"]}}

[tool.pytest.ini_options]
# Async tests use explicit @pytest.mark.asyncio (strict is the pytest-asyncio
# default; pinned here so a future default change can't silently alter collection).
asyncio_mode = "strict"
markers = [
    "network: tests that hit the real network (httpbin.org); excluded from CI by default via -m 'not network'",
]
