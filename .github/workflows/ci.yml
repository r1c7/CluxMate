name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual trigger (Actions → CI → "Run workflow"). Also a diagnostic: if the
  # button runs but push doesn't, the auto-trigger is the problem; if the
  # button itself is missing, GitHub didn't register this file at all.
  workflow_dispatch:

# Bash shell on all three runners keeps the run steps (quoting, `-m "not
# network"`) consistent — Git Bash is present on the Windows runner.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others (they exercise
      # different sandbox backends).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bubblewrap (Linux sandbox backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      # macOS ships sandbox-exec (Seatbelt) and Windows ships icacls/ctypes —
      # no install step needed on those runners.

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pytest / pytest-asyncio are deliberately NOT in pyproject.toml.
          pip install pytest pytest-asyncio

      - name: Report detected sandbox backend
        run: |
          python -c "from cluxmate.tools._sandbox import pick_sandbox; s = pick_sandbox('.'); print('backend:', type(s).__name__ if s else 'None (fail-closed)')"

      - name: Run tests (exclude live-network)
        run: pytest -q -m "not network"

  desktop-package:
    name: desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Same reasoning as the test matrix: each platform packages its own
      # native module (better-sqlite3) and installer format.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        # npm ci rebuilds better-sqlite3 against Node; electron-builder's
        # npmRebuild then re-targets it to Electron's ABI during packaging.
        run: npm ci

      - name: Package for current platform
        working-directory: desktop
        env:
          # Don't auto-discover an Apple signing identity — CI builds unsigned
          # (notarization is a separate distribution step).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cluxmate-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
